appId: com.hypershell.desktop
productName: HyperShell
npmRebuild: false
asar: true
asarUnpack:
  - "**/better-sqlite3/**"
  - "**/node-pty/**"
  - "**/serialport/**"
  - "**/@serialport/**"
files:
  - dist/**/*
  - package.json
directories:
  output: release
win:
  icon: build/icon.ico
  # Self-signed cert is not chained to a trusted root, so Get-AuthenticodeSignature
  # reports Status != Valid and electron-updater rejects the update before checking
  # publisherName. Skip the publisher-signature check; downloads stay HTTPS + sha512-verified.
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: hypershell-${version}-${arch}.${ext}
  # Bundles the ghostty-host.exe PTY host + its Mesa (software GL) runtime —
  # built separately by the ghostty port (see
  # docs/superpowers/plans/2026-08-25-ghostty-integration-plan.md) — into
  # resources/ghostty-host/. GHOSTTY_HOST_DIST must point at that build's
  # output directory (e.g. zig-out/bin, containing ghostty-host.exe and
  # mesa/) before packaging; apps/desktop's package:win:unsigned script fails
  # loudly if it's unset or missing the exe, since electron-builder itself
  # stays silent about a missing extraResources `from` directory.
  extraResources:
    - from: "${env.GHOSTTY_HOST_DIST}"
      to: ghostty-host/
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: HyperShell
mac:
  target:
    - target: dmg
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: hypershell-${version}-mac-${arch}.${ext}
  category: public.app-category.developer-tools
  darkModeSupport: true
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
linux:
  icon: build/icon.png
  # Without this, electron-builder derives the binary name from the package name
  # (@hypershell/desktop -> "@hypershelldesktop") and refuses to build: since
  # 26.x it rejects executable names containing characters that are unsafe in
  # file paths.
  executableName: hypershell
  category: Development
  maintainer: HyperShell Team <team@hypershell.app>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: hypershell-${version}-linux-${arch}.${ext}
  desktop:
    entry:
      Name: HyperShell
      Comment: SSH & Serial Terminal
      Terminal: "false"
      Type: Application
      Categories: Development;Network;
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
extraResources:
  - from: assets
    to: assets
    filter:
      - "**/*"
publish:
  provider: github
  owner: tomertec
  repo: HyperShell
