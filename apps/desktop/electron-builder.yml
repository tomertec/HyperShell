appId: com.hypershell.desktop
productName: HyperShell
npmRebuild: false
asar: true
asarUnpack:
  - "**/better-sqlite3/**"
  - "**/node-pty/**"
  - "**/serialport/**"
  - "**/@serialport/**"
files:
  - dist/**/*
  - package.json
directories:
  output: release
win:
  icon: build/icon.ico
  # Self-signed cert is not chained to a trusted root, so Get-AuthenticodeSignature
  # reports Status != Valid and electron-updater rejects the update before checking
  # publisherName. Skip the publisher-signature check; downloads stay HTTPS + sha512-verified.
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: hypershell-${version}-${arch}.${ext}
  # Bundles the ghostty-host.exe PTY host + its Mesa (software GL) runtime —
  # built separately by the ghostty port (see
  # docs/superpowers/plans/2026-08-25-ghostty-integration-plan.md) — into
  # resources/ghostty-host/, which is where resolveGhosttyHostPath looks in a
  # packaged app.
  #
  # The source is staged into build/ghostty-host first, by
  # scripts/stage-ghostty-host.mjs, from the directory GHOSTTY_HOST_DIST names
  # (e.g. the ghostty build's zig-out/bin, containing ghostty-host.exe and
  # mesa/). `from` cannot name that directory itself: app-builder-lib resolves
  # a `from` against the project directory before expanding `${env.X}`, so an
  # absolute value ends up as apps\desktop\C:\..., and a `from` that does not
  # exist is only a warning — the build would succeed and ship an app whose
  # terminal could never start. The staging script is what fails loudly.
  extraResources:
    - from: build/ghostty-host
      to: ghostty-host/
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: HyperShell
mac:
  target:
    - target: dmg
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: hypershell-${version}-mac-${arch}.${ext}
  category: public.app-category.developer-tools
  darkModeSupport: true
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
linux:
  icon: build/icon.png
  # Without this, electron-builder derives the binary name from the package name
  # (@hypershell/desktop -> "@hypershelldesktop") and refuses to build: since
  # 26.x it rejects executable names containing characters that are unsafe in
  # file paths.
  executableName: hypershell
  category: Development
  maintainer: HyperShell Team <team@hypershell.app>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: hypershell-${version}-linux-${arch}.${ext}
  desktop:
    entry:
      Name: HyperShell
      Comment: SSH & Serial Terminal
      Terminal: "false"
      Type: Application
      Categories: Development;Network;
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
extraResources:
  - from: assets
    to: assets
    filter:
      - "**/*"
publish:
  provider: github
  owner: tomertec
  repo: HyperShell
