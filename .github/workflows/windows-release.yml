name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Pinned, not windows-latest: that label moved to Visual Studio 2026 (major
    # version 18) in June 2026, and neither the node-gyp bundled with pnpm nor
    # @electron/rebuild recognizes it — both report "unknown version undefined"
    # and fail to build @vscode/windows-process-tree. Unpin once both ship
    # VS 2026 detection.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The terminal is a native ghostty surface, so an installer built without
      # the host executable ships an app that cannot open a session. Nothing in
      # this workflow produces one yet, so the job stops here with an
      # explanation rather than failing later inside electron-builder.
      - name: Require ghostty host build output
        shell: bash
        run: |
          if [ -z "${GHOSTTY_HOST_DIST:-}" ]; then
            echo "::error::GHOSTTY_HOST_DIST is not set, so this run cannot package a working installer."
            echo "The terminal renderer is an out-of-process ghostty host: apps/desktop/scripts/stage-ghostty-host.mjs"
            echo "copies ghostty-host.exe (plus ghostty-vt.dll and mesa/ when present) out of that directory into"
            echo "apps/desktop/build/ghostty-host for electron-builder."
            echo "The executable is built from the tomertec/ghostty 'embed-host' branch with -Dembed-host=true;"
            echo "see docs/release/windows-packaging.md."
            echo "No CI step builds or downloads it yet, so Windows release packaging is a manual, local step until"
            echo "an exe source lands in this workflow."
            exit 1
          fi
          echo "GHOSTTY_HOST_DIST=$GHOSTTY_HOST_DIST"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Fails before anything is built or published if the tag disagrees with the
      # versions committed at this ref.
      - name: Verify tag matches package versions
        run: node .tools/release/verify-tag-version.mjs --ref-name "${{ github.ref_name }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @hypershell/ui exec playwright install chromium

      - name: Lint
        run: pnpm ci:lint

      - name: Workspace build
        run: pnpm ci:build

      - name: Workspace unit tests
        run: pnpm ci:test

      - name: Playwright smoke
        run: pnpm ci:test:e2e

      - name: Rebuild native modules for Electron
        run: pnpm --filter @hypershell/desktop rebuild:native

      # Boots the real shell (preload bridge, IPC schemas, SQLite, windows)
      # against a throwaway data directory before anything is packaged.
      - name: Build desktop bundle
        run: pnpm --filter @hypershell/desktop run build:bundle

      - name: Electron E2E
        run: pnpm ci:test:e2e:electron

      - name: Package Windows release (unsigned)
        run: pnpm release:windows:unsigned

      - name: Generate release manifest
        run: pnpm release:manifest

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: apps/desktop/release/**
          if-no-files-found: error
          retention-days: 30

      - name: Attach Windows installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --generate-notes --title "$TAG" || true
          cd apps/desktop/release
          EXE=$(find . -maxdepth 1 -name '*.exe' | head -1)
          if [ -z "$EXE" ]; then
            echo "No installer found, skipping upload"
            exit 0
          fi
          echo "Uploading installer $EXE to release $TAG"
          gh release upload "$TAG" "$EXE" --clobber
          # Upload auto-update metadata LAST so a polling client never sees
          # an advertised version before its installer asset exists.
          [ -f latest.yml ] && gh release upload "$TAG" latest.yml --clobber || true
          for BLOCKMAP in *.blockmap; do
            [ -e "$BLOCKMAP" ] && gh release upload "$TAG" "$BLOCKMAP" --clobber || true
          done
